[project]
name = "model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "monai>=1.4.0",
    "nibabel>=5.3.2",
    "numpy>=1.26.4",
    "torch>=2.7.0",
    "torchsummary>=1.5.1",
    "tqdm>=4.67.1",
]


[dependency-groups]
dev = ["ruff>=0.11.4", "mypy>=1.15.0", "types-tqdm"]


[tool.mypy]
exclude = [".venv"]


[tool.ruff.lint.isort]
known-first-party = ["segmentation"]
force-sort-within-sections = true
combine-as-imports = true


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"


[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"


[tool.uv.sources]
torch = { index = "pytorch" }
